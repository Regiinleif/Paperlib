# CI/CD pipeline for PaperLib.
#
# "CI" = Continuous Integration: every time code is pushed, GitHub automatically
# installs the project and runs the test suite, so broken code is caught early.
# This file tells GitHub *what* to run and *when*.
#
# You can watch each run under the "Actions" tab of the GitHub repo.

name: CI

# WHEN does this pipeline run?
on:
  push:
    branches: [ main ]        # on every push to main
  pull_request:               # and on every pull request
  workflow_dispatch:          # and a manual "Run workflow" button in the UI

jobs:
  test:
    name: Run tests
    # WHERE it runs: a fresh Windows machine (matches PaperLib's target OS).
    runs-on: windows-latest

    # Test against multiple Python versions to catch version-specific breakage.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # 1. Get the code onto the runner.
      - name: Check out the repository
        uses: actions/checkout@v4

      # 2. Install the requested Python version.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 3. Install the app's dependencies plus the test runner.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. A quick syntax gate: every source file must at least compile.
      - name: Syntax check
        run: python -m compileall src run.py run_api.py run_eval.py

      # 5. Run the test suite (logic only; no API key needed).
      - name: Run pytest
        run: pytest

  # ---------------------------------------------------------------------------
  # "CD" half: build the web-app container image, and push it to the GitHub
  # Container Registry (ghcr.io) on pushes to main. Pull requests build only
  # (no push) so a fork's PR can't publish an image. The image is what an Azure
  # Container Apps deploy would pull — point Azure at this ghcr package, or swap
  # the registry for an Azure Container Registry.
  docker:
    name: Build & push image
    needs: test                 # only build once the tests are green
    runs-on: ubuntu-latest      # Docker builds are Linux-native
    permissions:
      contents: read
      packages: write           # allow pushing to ghcr.io with GITHUB_TOKEN
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to ghcr.io only on a real push to main (not on PRs), using the
      # workflow's built-in token — no extra secrets to configure.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive lowercased image tags from the repo name (ghcr requires lowercase).
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy the freshly-built image to Azure Container Apps, on pushes to main
  # only. Azure already holds the ghcr.io pull credential and the app's env /
  # Key Vault config, so this step only swaps the running image to the new
  # commit's tag (sha-<short>) — the same manual `az containerapp update` we
  # used to run by hand, now automatic. Requires the AZURE_CREDENTIALS secret
  # (a service principal scoped to the `paperlib` resource group).
  deploy:
    name: Deploy to Azure Container Apps
    needs: docker               # only deploy an image that was just built & pushed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update the Container App to the new image
        run: |
          image=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Deploying ${image}:sha-${short}"
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name paperlib \
            --resource-group paperlib \
            --image "${image}:sha-${short}"
